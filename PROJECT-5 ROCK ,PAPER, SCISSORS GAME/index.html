<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">

    <h1>🎮 Rock Paper Scissors</h1>

    <!-- Score Board -->
    <div class="score-board">

      <div class="score-card">
        <h2>You</h2>
        <p id="user-score">0</p>
      </div>

      <div class="score-card">
        <h2>Computer</h2>
        <p id="computer-score">0</p>
      </div>

    </div>

    <!-- Choices -->
    <div class="choices">

      <button class="choice" data-choice="rock">
        ✊ <span>Rock</span>
      </button>

      <button class="choice" data-choice="paper">
        ✋ <span>Paper</span>
      </button>

      <button class="choice" data-choice="scissors">
        ✌️ <span>Scissors</span>
      </button>

    </div>

    <!-- Result -->
    <div class="result-box">

      <h2 id="result-text">Choose your move!</h2>

      <div class="moves">

        <p>
          👨 You Chose:
          <span id="user-choice">-</span>
        </p>

        <p>
          💻 Computer Chose:
          <span id="computer-choice">-</span>
        </p>

      </div>

    </div>

    <!-- Restart -->
    <button id="restart-btn">
      🔄 Restart Game
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
